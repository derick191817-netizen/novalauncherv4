name: Android CI

# Compila na nuvem (sem PC): gera o APK debug e roda os testes.
# Disparo manual: aba Actions -> Android CI -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Atualizado para v4 para evitar bugs de compatibilidade
      - uses: android-actions/setup-android@v4

      # O projeto não tem gradlew: usamos o comando global `gradle` (8.9; o AGP 8.5.2 exige 8.7+).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # O segredo está aqui: o "yes |" aceita todas as licenças automaticamente
      - name: Instalar plataforma e build-tools (aceitando licenças)
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Versões
        run: |
          java -version
          gradle --version

      # APK primeiro: mesmo que um teste falhe, você recebe o APK para instalar.
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Testes não bloqueiam o APK.
      - name: Testes unitarios
        if: always()
        continue-on-error: true
        run: gradle testDebugUnitTest --continue --stacktrace

      - name: Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
